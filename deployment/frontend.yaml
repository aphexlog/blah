apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextgen-edc-frontend
  namespace: nextgen-edc
  labels:
    app: nextgen-edc-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nextgen-edc-frontend
  template:
    metadata:
      labels:
        app: nextgen-edc-frontend
    spec:
      containers:
      - name: frontend
        image: nextgen-edc/frontend:latest
        ports:
        - containerPort: 3000
        env:
        - name: VITE_API_URL
          value: "https://api.yourdomain.com"
        - name: VITE_WS_URL
          value: "wss://api.yourdomain.com"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: nextgen-edc-frontend-service
  namespace: nextgen-edc
spec:
  selector:
    app: nextgen-edc-frontend
  ports:
  - port: 3000
    targetPort: 3000
  type: ClusterIP